<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tâches</title>
<meta name="description" content="Gestion de tâches simple, utilisable hors ligne.">
<meta name="theme-color" id="themeColor" content="#a3abbb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tâches">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<script>
// Applique le thème avant l'affichage pour éviter un flash.
(function () {
  var t = null;
  try { t = localStorage.getItem('taches-theme'); } catch (e) {}
  if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.dataset.theme = t;
})();
</script>
<style>
:root {
  --base: #a3abbb;
  --bg: linear-gradient(165deg, #b4bbc9 0%, #a2aaba 30%, #8c94a7 62%, #a7afc0 100%);
  --streak: rgba(255, 255, 255, .22);
  --text: #ffffff;
  --muted: rgba(255, 255, 255, .72);
  --glass: rgba(255, 255, 255, .13);
  --glass-hi: rgba(255, 255, 255, .30);
  --edge: rgba(255, 255, 255, .34);
  --glow: 0 0 18px rgba(255, 255, 255, .35);
  --shadow: 0 10px 30px rgba(52, 60, 82, .18);
  --sheet: rgba(134, 142, 160, .82);
  --field: rgba(255, 255, 255, .16);
  --scrim: rgba(40, 46, 62, .35);
  --danger: #ffd9d9;
}
:root[data-theme="dark"] {
  --base: #10131a;
  --bg: linear-gradient(165deg, #262b38 0%, #171a23 35%, #0c0e14 68%, #1b1f2a 100%);
  --streak: rgba(255, 255, 255, .06);
  --text: #f3f5fa;
  --muted: rgba(243, 245, 250, .6);
  --glass: rgba(255, 255, 255, .06);
  --glass-hi: rgba(255, 255, 255, .16);
  --edge: rgba(255, 255, 255, .14);
  --glow: 0 0 16px rgba(255, 255, 255, .10);
  --shadow: 0 10px 30px rgba(0, 0, 0, .40);
  --sheet: rgba(30, 34, 45, .88);
  --field: rgba(255, 255, 255, .08);
  --scrim: rgba(0, 0, 0, .55);
  --danger: #ff9c9c;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--base); }
html, body { margin: 0; }
body {
  color: var(--text);
  font: 17px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  min-height: 100dvh;
  padding: calc(env(safe-area-inset-top) + 18px) 18px calc(env(safe-area-inset-bottom) + 120px);
  -webkit-user-select: none; user-select: none;
}
/* Fond fixe : dégradé + reflets diagonaux */
body::before {
  content: ""; position: fixed; inset: 0; z-index: -1;
  background:
    linear-gradient(112deg, transparent 38%, var(--streak) 47%, transparent 56%),
    linear-gradient(104deg, transparent 8%, var(--streak) 20%, transparent 34%),
    linear-gradient(118deg, transparent 66%, var(--streak) 80%, transparent 94%),
    var(--bg);
}
main { max-width: 560px; margin: 0 auto; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }

.glass {
  background: var(--glass);
  border: 1px solid var(--edge);
  -webkit-backdrop-filter: blur(22px) saturate(140%);
  backdrop-filter: blur(22px) saturate(140%);
  box-shadow: inset 0 1px 0 var(--glass-hi), var(--shadow);
}

header { position: relative; }
.top { display: flex; justify-content: flex-end; }
.round { border-radius: 50%; display: grid; place-items: center; transition: transform .15s; }
.round:active { transform: scale(.94); }
#menuBtn { width: 46px; height: 46px; }
h1 { font-size: 46px; font-weight: 300; letter-spacing: -.01em; margin: 6px 6px 20px; }

.menu {
  position: absolute; right: 0; top: 54px; z-index: 5; min-width: 240px;
  border-radius: 20px; padding: 6px; background: var(--sheet);
}
.menu button { display: flex; align-items: center; gap: 12px; width: 100%; padding: 13px 14px; border-radius: 14px; text-align: left; }
.menu button:active { background: var(--field); }
.menu svg { width: 20px; height: 20px; flex: none; }

/* Sélecteur à 3 segments */
.seg { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); padding: 5px; border-radius: 99px; }
.seg .thumb {
  position: absolute; top: 5px; bottom: 5px; left: 5px; width: calc((100% - 10px) / 3);
  border-radius: 99px; background: var(--glass-hi); border: 1px solid var(--edge);
  box-shadow: inset 0 1px 0 var(--glass-hi), var(--glow);
  transform: translateX(calc(var(--i, 0) * 100%)); transition: transform .28s cubic-bezier(.3, .8, .3, 1);
}
.seg button {
  position: relative; padding: 12px 4px; border-radius: 99px; color: var(--muted);
  font-size: 15px; font-weight: 500; white-space: nowrap; transition: color .2s;
}
.seg button[aria-pressed="true"] { color: var(--text); font-weight: 600; }

ul { list-style: none; margin: 22px 0 0; padding: 0; display: grid; gap: 10px; }
.task { display: flex; align-items: center; gap: 6px; border-radius: 30px; padding: 8px 14px 8px 8px; min-height: 64px; }
.check { flex: none; width: 48px; height: 48px; display: grid; place-items: center; }
.check i {
  width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--muted);
  display: grid; place-items: center; transition: background .15s, border-color .15s;
}
.check svg { width: 15px; height: 15px; opacity: 0; stroke: var(--base); }
.task.done .check i { background: var(--text); border-color: var(--text); }
.task.done .check svg { opacity: 1; }
.title { flex: 1; min-width: 0; text-align: left; padding: 8px 4px; overflow-wrap: anywhere; }
.task.done .title { text-decoration: line-through; color: var(--muted); }
.badge {
  flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: 99px;
  font-size: 13px; background: var(--glass); border: 1px solid var(--edge); color: var(--text);
}
.badge svg { width: 14px; height: 14px; }
.badge.late { color: var(--danger); font-weight: 600; }

.empty { text-align: center; color: var(--muted); padding: 56px 20px; }

#add {
  position: fixed; right: max(20px, calc(50% - 280px)); bottom: calc(env(safe-area-inset-bottom) + 26px);
  width: 68px; height: 68px;
}
#add svg { width: 28px; height: 28px; }

dialog {
  border: 0; padding: 0; margin: auto auto 0; width: 100%; max-width: 560px; color: var(--text);
  border-radius: 28px 28px 0 0; background: var(--sheet); border-top: 1px solid var(--edge);
  -webkit-backdrop-filter: blur(30px); backdrop-filter: blur(30px);
}
dialog::backdrop { background: var(--scrim); }
form { padding: 22px 18px calc(env(safe-area-inset-bottom) + 22px); display: grid; gap: 16px; }
form h2 { margin: 0 4px; font-size: 22px; font-weight: 500; }
#fTitle {
  width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--edge);
  background: var(--field); font-size: 17px; -webkit-user-select: text; user-select: text;
}
#fTitle::placeholder { color: var(--muted); }
.actions { display: flex; gap: 10px; }
.btn { flex: 1; padding: 14px; border-radius: 99px; font-weight: 600; background: var(--field); border: 1px solid var(--edge); }
.btn.primary { background: var(--text); color: var(--base); border-color: transparent; }
.btn.danger { flex: none; padding: 14px 18px; color: var(--danger); }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
  <header>
    <div class="top">
      <button class="glass round" id="menuBtn" aria-label="Options" aria-haspopup="true" aria-expanded="false">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="currentColor"><circle cx="4.5" cy="11" r="1.9"/><circle cx="11" cy="11" r="1.9"/><circle cx="17.5" cy="11" r="1.9"/></svg>
      </button>
    </div>
    <div class="menu glass" id="menu" hidden>
      <button id="themeBtn">
        <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></svg>
        <span id="themeLabel"></span>
      </button>
      <button id="clearDone">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 002 2h6a2 2 0 002-2l1-12M9 7V4h6v3"/></svg>
        <span>Supprimer les terminées</span>
      </button>
    </div>
    <h1>Tâches</h1>
  </header>

  <nav class="seg glass" id="tabs" aria-label="Jour">
    <span class="thumb"></span>
    <button data-i="0">Aujourd’hui</button>
    <button data-i="1">Demain</button>
    <button data-i="2">Dans 2 jours</button>
  </nav>

  <ul id="list"></ul>
  <div class="empty" id="empty" hidden>Rien de prévu.</div>
</main>

<button class="glass round" id="add" aria-label="Nouvelle tâche">
  <svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M14 5v18M5 14h18"/></svg>
</button>

<dialog id="sheet">
  <form id="form" method="dialog">
    <h2 id="sheetTitle">Nouvelle tâche</h2>
    <input id="fTitle" required maxlength="200" autocomplete="off" placeholder="Que dois-tu faire ?" aria-label="Titre de la tâche">
    <div class="seg glass" id="dayPick" role="group" aria-label="Jour">
      <span class="thumb"></span>
      <button type="button" data-i="0">Aujourd’hui</button>
      <button type="button" data-i="1">Demain</button>
      <button type="button" data-i="2">Dans 2 jours</button>
    </div>
    <div class="actions">
      <button type="button" class="btn danger" id="del" hidden>Supprimer</button>
      <button type="button" class="btn" id="cancel">Annuler</button>
      <button type="submit" class="btn primary">Enregistrer</button>
    </div>
  </form>
</dialog>

<script>
(() => {
  const KEY = 'taches-gestion-v1', THEME_KEY = 'taches-theme';
  const $ = id => document.getElementById(id);
  const root = document.documentElement;
  const CAL = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="12" height="11" rx="2.5"/><path d="M2 6.5h12M5.2 1.6v2.6M10.8 1.6v2.6"/></svg>';
  const SUN = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
  const MOON = '<path d="M20 14.5A8.5 8.5 0 019.5 4a8.5 8.5 0 1010.5 10.5z"/>';

  const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const dayIso = n => { const d = new Date(); d.setDate(d.getDate() + n); return iso(d); };
  const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  // Nombre de jours entre aujourd'hui et l'échéance (négatif = en retard).
  const diff = due => due ? Math.round((parse(due) - parse(dayIso(0))) / 864e5) : 0;
  const tabOf = t => Math.max(0, Math.min(2, diff(t.due)));

  let tasks = [];
  try { tasks = JSON.parse(localStorage.getItem(KEY)) || []; } catch { tasks = []; }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(tasks)); } catch {} };
  // Les tâches cochées un jour précédent disparaissent d'elles-mêmes.
  const before = tasks.length;
  tasks = tasks.filter(t => !(t.done && t.doneAt && t.doneAt < dayIso(0)));
  if (tasks.length !== before) save();

  let tab = 0, editing = null, pick = 0, pickStart = 0;

  function setSeg(seg, i) {
    seg.style.setProperty('--i', i);
    seg.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', +b.dataset.i === i));
  }

  function badge(t) {
    const n = diff(t.due);
    const b = document.createElement('span');
    b.className = 'badge' + (n < 0 && !t.done ? ' late' : '');
    b.innerHTML = CAL;
    const label = n < 0 ? 'En retard' : n === 0 ? 'Aujourd’hui' : n === 1 ? 'Demain' : n === 2 ? 'Dans 2 jours'
      : parse(t.due).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
    b.append(label);
    return b;
  }

  function render() {
    setSeg($('tabs'), tab);
    const items = tasks.filter(t => tabOf(t) === tab)
      .sort((a, b) => (a.done - b.done) || (a.due || '').localeCompare(b.due || '') || (a.created - b.created));
    const list = $('list');
    list.replaceChildren();
    for (const t of items) {
      const li = document.createElement('li');
      li.className = 'task glass' + (t.done ? ' done' : '');

      const check = document.createElement('button');
      check.className = 'check';
      check.setAttribute('aria-label', t.done ? 'Marquer comme à faire' : 'Marquer comme terminée');
      check.innerHTML = '<i><svg viewBox="0 0 14 14" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 7.5l3 3 6-7"/></svg></i>';
      check.onclick = () => { t.done = !t.done; t.doneAt = t.done ? dayIso(0) : ''; save(); render(); };

      const title = document.createElement('button');
      title.className = 'title';
      title.textContent = t.title;
      title.setAttribute('aria-label', 'Modifier : ' + t.title);
      title.onclick = () => openSheet(t);

      li.append(check, title, badge(t));
      list.append(li);
    }
    $('empty').hidden = items.length > 0;
  }

  function openSheet(t) {
    editing = t;
    $('sheetTitle').textContent = t ? 'Modifier la tâche' : 'Nouvelle tâche';
    $('fTitle').value = t ? t.title : '';
    pick = pickStart = t ? tabOf(t) : tab;
    setSeg($('dayPick'), pick);
    $('del').hidden = !t;
    $('sheet').showModal();
    if (!t) $('fTitle').focus();
  }

  $('form').addEventListener('submit', e => {
    e.preventDefault();
    const title = $('fTitle').value.trim();
    if (!title) return;
    if (editing) {
      editing.title = title;
      if (pick !== pickStart) editing.due = dayIso(pick);
    } else {
      tasks.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7), title, due: dayIso(pick), done: false, doneAt: '', created: Date.now() });
      tab = pick;
    }
    save(); $('sheet').close(); render();
  });
  $('dayPick').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (b) { pick = +b.dataset.i; setSeg($('dayPick'), pick); }
  });
  $('cancel').onclick = () => $('sheet').close();
  $('del').onclick = () => { tasks = tasks.filter(t => t !== editing); save(); $('sheet').close(); render(); };
  $('sheet').addEventListener('click', e => { if (e.target === $('sheet')) $('sheet').close(); });
  $('add').onclick = () => openSheet(null);
  $('tabs').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (b) { tab = +b.dataset.i; render(); }
  });

  // Menu « … » : thème clair / sombre et nettoyage
  function showTheme() {
    const dark = root.dataset.theme === 'dark';
    $('themeLabel').textContent = dark ? 'Mode clair' : 'Mode sombre';
    $('themeIcon').innerHTML = dark ? SUN : MOON;
    $('themeColor').content = getComputedStyle(root).getPropertyValue('--base').trim();
  }
  function toggleMenu(open) {
    $('menu').hidden = !open;
    $('menuBtn').setAttribute('aria-expanded', open);
  }
  $('menuBtn').onclick = e => { e.stopPropagation(); toggleMenu($('menu').hidden); };
  document.addEventListener('click', e => { if (!$('menu').contains(e.target)) toggleMenu(false); });
  $('themeBtn').onclick = () => {
    root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
    try { localStorage.setItem(THEME_KEY, root.dataset.theme); } catch {}
    showTheme(); toggleMenu(false);
  };
  $('clearDone').onclick = () => {
    toggleMenu(false);
    const n = tasks.filter(t => t.done).length;
    if (!n) return;
    if (confirm(`Supprimer ${n} tâche${n > 1 ? 's' : ''} terminée${n > 1 ? 's' : ''} ?`)) { tasks = tasks.filter(t => !t.done); save(); render(); }
  };

  document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });
  showTheme();
  render();

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
