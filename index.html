<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mes Tâches</title>
<meta name="description" content="Gestion de tâches simple, utilisable hors ligne.">
<meta name="theme-color" content="#f4f5f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tâches">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
:root {
  --bg: #f4f5f9;
  --card: #ffffff;
  --text: #14161c;
  --muted: #7a8090;
  --line: #e4e6ee;
  --accent: #4f46e5;
  --accent-soft: #e9e8fd;
  --danger: #dc2626;
  --high: #dc2626;
  --mid: #d97706;
  --low: #16a34a;
  --shadow: 0 1px 2px rgba(20, 22, 28, .05), 0 6px 20px rgba(20, 22, 28, .05);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1115;
    --card: #1a1d24;
    --text: #f1f2f6;
    --muted: #8d93a3;
    --line: #2a2e38;
    --accent: #8b85ff;
    --accent-soft: #26244a;
    --danger: #f87171;
    --high: #f87171;
    --mid: #fbbf24;
    --low: #4ade80;
    --shadow: none;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  min-height: 100dvh;
  padding: calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 110px);
  -webkit-user-select: none; user-select: none;
}
main { max-width: 560px; margin: 0 auto; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }

header h1 { font-size: 32px; letter-spacing: -.02em; margin: 0; }
header p { margin: 2px 0 0; color: var(--muted); }
header p::first-letter { text-transform: uppercase; }

.progress {
  background: var(--card); border-radius: 18px; padding: 16px; margin: 18px 0 14px;
  box-shadow: var(--shadow);
}
.progress-row { display: flex; justify-content: space-between; align-items: baseline; }
.progress-row strong { font-size: 15px; }
.progress-row span { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.bar { height: 8px; border-radius: 99px; background: var(--line); margin-top: 10px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .3s ease; }

.filters { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 12px; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.chip {
  flex: none; padding: 8px 14px; border-radius: 99px; background: var(--card);
  color: var(--muted); font-size: 14px; font-weight: 600; box-shadow: var(--shadow);
}
.chip[aria-pressed="true"] { background: var(--accent); color: #fff; }

.search {
  width: 100%; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--card); margin-bottom: 14px; -webkit-user-select: text; user-select: text;
}
.search:focus, .field input:focus, .field select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.task {
  display: flex; align-items: flex-start; gap: 12px; background: var(--card);
  border-radius: 16px; padding: 14px; box-shadow: var(--shadow);
}
.check {
  flex: none; width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--muted);
  display: grid; place-items: center; margin-top: 1px; transition: background .15s, border-color .15s;
}
.check svg { width: 14px; height: 14px; opacity: 0; }
.task.done .check { background: var(--accent); border-color: var(--accent); }
.task.done .check svg { opacity: 1; }
.body { flex: 1; min-width: 0; text-align: left; }
.title { font-weight: 600; overflow-wrap: anywhere; }
.task.done .title { text-decoration: line-through; color: var(--muted); }
.meta { display: flex; flex-wrap: wrap; gap: 6px 10px; margin-top: 5px; font-size: 13px; color: var(--muted); align-items: center; }
.meta:empty { display: none; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 5px; }
.p-high .dot { background: var(--high); } .p-mid .dot { background: var(--mid); } .p-low .dot { background: var(--low); }
.late { color: var(--danger); font-weight: 600; }
.tag { background: var(--accent-soft); color: var(--accent); padding: 2px 8px; border-radius: 99px; font-weight: 600; }

.empty { text-align: center; color: var(--muted); padding: 48px 20px; }
.empty b { display: block; color: var(--text); font-size: 18px; margin-bottom: 4px; }

.fab {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom) + 22px);
  background: var(--accent); color: #fff; font-weight: 700; padding: 15px 26px;
  border-radius: 99px; box-shadow: 0 8px 24px rgba(79, 70, 229, .4);
}
.fab:active { transform: translateX(-50%) scale(.97); }
.clear { display: block; margin: 18px auto 0; color: var(--muted); font-size: 14px; text-decoration: underline; }

dialog {
  border: 0; padding: 0; margin: auto auto 0; width: 100%; max-width: 560px;
  background: var(--card); color: var(--text); border-radius: 22px 22px 0 0;
}
dialog::backdrop { background: rgba(0, 0, 0, .45); }
form { padding: 20px 18px calc(env(safe-area-inset-bottom) + 20px); display: grid; gap: 14px; }
form h2 { margin: 0; font-size: 20px; }
.field { display: grid; gap: 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
.field input, .field select {
  width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--bg); font-size: 16px; font-weight: 400; color: var(--text);
  -webkit-user-select: text; user-select: text; min-height: 46px;
}
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.actions { display: flex; gap: 10px; margin-top: 4px; }
.btn { flex: 1; padding: 14px; border-radius: 14px; font-weight: 700; background: var(--bg); }
.btn.primary { background: var(--accent); color: #fff; }
.btn.danger { color: var(--danger); flex: none; padding: 14px 16px; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Mes Tâches</h1>
    <p id="today"></p>
  </header>

  <section class="progress" aria-label="Progression">
    <div class="progress-row"><strong id="summary"></strong><span id="percent"></span></div>
    <div class="bar"><i id="bar"></i></div>
  </section>

  <nav class="filters" id="filters" aria-label="Filtres">
    <button class="chip" data-filter="todo">À faire</button>
    <button class="chip" data-filter="today">Aujourd'hui</button>
    <button class="chip" data-filter="late">En retard</button>
    <button class="chip" data-filter="done">Terminées</button>
    <button class="chip" data-filter="all">Toutes</button>
  </nav>

  <input class="search" id="search" type="search" placeholder="Rechercher…" aria-label="Rechercher une tâche">

  <ul id="list"></ul>
  <div class="empty" id="empty" hidden><b>Rien ici</b><span id="emptyText"></span></div>
  <button class="clear" id="clearDone" hidden>Supprimer les tâches terminées</button>
</main>

<button class="fab" id="add">+ Nouvelle tâche</button>

<dialog id="sheet">
  <form id="form" method="dialog">
    <h2 id="sheetTitle">Nouvelle tâche</h2>
    <label class="field">Titre
      <input id="fTitle" required maxlength="200" autocomplete="off" placeholder="Ex. : Appeler le plombier">
    </label>
    <div class="two">
      <label class="field">Échéance
        <input id="fDue" type="date">
      </label>
      <label class="field">Priorité
        <select id="fPrio">
          <option value="low">Basse</option>
          <option value="mid" selected>Moyenne</option>
          <option value="high">Haute</option>
        </select>
      </label>
    </div>
    <label class="field">Catégorie
      <input id="fCat" maxlength="30" autocomplete="off" list="cats" placeholder="Ex. : Maison, Travail…">
      <datalist id="cats"></datalist>
    </label>
    <div class="actions">
      <button type="button" class="btn danger" id="del" hidden>Supprimer</button>
      <button type="button" class="btn" id="cancel">Annuler</button>
      <button type="submit" class="btn primary">Enregistrer</button>
    </div>
  </form>
</dialog>

<script>
(() => {
  const KEY = 'taches-gestion-v1';
  const $ = id => document.getElementById(id);
  const PRIO = { high: 'Haute', mid: 'Moyenne', low: 'Basse' };
  const RANK = { high: 0, mid: 1, low: 2 };

  let tasks = [];
  try { tasks = JSON.parse(localStorage.getItem(KEY)) || []; } catch { tasks = []; }
  let filter = 'todo';
  let editingId = null;

  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(tasks)); } catch {} };
  const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const todayIso = () => iso(new Date());

  function dueLabel(due) {
    const t = todayIso();
    if (due === t) return "Aujourd'hui";
    const tm = new Date(); tm.setDate(tm.getDate() + 1);
    if (due === iso(tm)) return 'Demain';
    const [y, m, d] = due.split('-').map(Number);
    return new Date(y, m - 1, d).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
  }

  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function visible() {
    const t = todayIso();
    const q = $('search').value.trim().toLowerCase();
    return tasks
      .filter(x => {
        if (q && !(x.title.toLowerCase().includes(q) || (x.cat || '').toLowerCase().includes(q))) return false;
        if (filter === 'todo') return !x.done;
        if (filter === 'done') return x.done;
        if (filter === 'today') return !x.done && x.due === t;
        if (filter === 'late') return !x.done && x.due && x.due < t;
        return true;
      })
      .sort((a, b) =>
        (a.done - b.done) ||
        ((a.due || '9999') < (b.due || '9999') ? -1 : (a.due || '9999') > (b.due || '9999') ? 1 : 0) ||
        (RANK[a.prio] - RANK[b.prio]) ||
        (b.created - a.created));
  }

  function render() {
    const t = todayIso();
    const done = tasks.filter(x => x.done).length;
    const total = tasks.length;
    const left = total - done;
    $('summary').textContent = total === 0 ? 'Aucune tâche pour le moment'
      : left === 0 ? 'Tout est terminé 🎉'
      : `${left} tâche${left > 1 ? 's' : ''} à faire`;
    $('percent').textContent = total ? `${done}/${total}` : '';
    $('bar').style.width = total ? `${Math.round(done / total * 100)}%` : '0';

    document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c.dataset.filter === filter));

    const list = $('list');
    list.replaceChildren();
    const items = visible();
    for (const x of items) {
      const li = el('li', 'task' + (x.done ? ' done' : ''));

      const check = el('button', 'check');
      check.setAttribute('aria-label', x.done ? 'Marquer comme à faire' : 'Marquer comme terminée');
      check.innerHTML = '<svg viewBox="0 0 14 14" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 7.5l3 3 6-7"/></svg>';
      check.onclick = () => { x.done = !x.done; save(); render(); };

      const body = el('button', 'body');
      body.setAttribute('aria-label', `Modifier : ${x.title}`);
      body.append(el('div', 'title', x.title));
      const meta = el('div', 'meta');
      if (x.due) meta.append(el('span', !x.done && x.due < t ? 'late' : '', (!x.done && x.due < t ? 'En retard · ' : '') + dueLabel(x.due)));
      const pr = el('span', 'p-' + x.prio);
      pr.append(el('i', 'dot'), PRIO[x.prio]);
      meta.append(pr);
      if (x.cat) meta.append(el('span', 'tag', x.cat));
      body.append(meta);
      body.onclick = () => openSheet(x);

      li.append(check, body);
      list.append(li);
    }

    $('empty').hidden = items.length > 0;
    $('emptyText').textContent = total === 0 ? 'Appuie sur « Nouvelle tâche » pour commencer.'
      : 'Aucune tâche ne correspond à ce filtre.';
    $('clearDone').hidden = !(done > 0 && (filter === 'done' || filter === 'all'));

    const cats = [...new Set(tasks.map(x => x.cat).filter(Boolean))].sort();
    $('cats').replaceChildren(...cats.map(c => { const o = el('option'); o.value = c; return o; }));
  }

  function openSheet(task) {
    editingId = task ? task.id : null;
    $('sheetTitle').textContent = task ? 'Modifier la tâche' : 'Nouvelle tâche';
    $('fTitle').value = task ? task.title : '';
    $('fDue').value = task ? task.due || '' : '';
    $('fPrio').value = task ? task.prio : 'mid';
    $('fCat').value = task ? task.cat || '' : '';
    $('del').hidden = !task;
    $('sheet').showModal();
    if (!task) $('fTitle').focus();
  }

  $('form').addEventListener('submit', e => {
    e.preventDefault();
    const title = $('fTitle').value.trim();
    if (!title) return;
    const data = { title, due: $('fDue').value || '', prio: $('fPrio').value, cat: $('fCat').value.trim() };
    if (editingId) Object.assign(tasks.find(x => x.id === editingId) || {}, data);
    else tasks.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7), done: false, created: Date.now(), ...data });
    save(); $('sheet').close(); render();
  });
  $('cancel').onclick = () => $('sheet').close();
  $('del').onclick = () => {
    tasks = tasks.filter(x => x.id !== editingId);
    save(); $('sheet').close(); render();
  };
  $('sheet').addEventListener('click', e => { if (e.target === $('sheet')) $('sheet').close(); });
  $('add').onclick = () => openSheet(null);
  $('filters').addEventListener('click', e => {
    const c = e.target.closest('.chip');
    if (c) { filter = c.dataset.filter; render(); }
  });
  $('search').addEventListener('input', render);
  $('clearDone').onclick = () => {
    if (confirm('Supprimer toutes les tâches terminées ?')) { tasks = tasks.filter(x => !x.done); save(); render(); }
  };

  $('today').textContent = new Date().toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });
  render();

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
